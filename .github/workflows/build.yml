name: Build PhoneCast APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - run: |
          unzip -o PhoneCast_Android_APK_Project.zip
          cd PhoneCastAndroid
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCast-APK
          path: PhoneCastAndroid/app/build/outputs/apk/debug/app-debug.apk
